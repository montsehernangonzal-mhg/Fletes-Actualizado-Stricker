<section>
    <h2>Choferes</h2>

    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>nombre</th>
                    <th>licencia</th>
                    <th>estatus</th>
                    <th>opciones</th>
                </tr>
            </thead>

            <tbody>
                <template x-for="c in Choferes" :key="c.id">
                    <tr>
                        <td x-text="c.nombre"></td>
                        <td x-text="c.licencia"></td>
                        <td x-text="c.estatus"></td>
                        <td><button @click="delete_chofer(c.id)">Borrar</button></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <p x-show="Choferes.length == 0">no hay choferes registrados</p>

</section>
