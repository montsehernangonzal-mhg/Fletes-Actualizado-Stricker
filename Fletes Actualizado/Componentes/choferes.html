<section>
    <h2>Choferes</h2>

    <div x-show="choferEditando !== null" x-cloak>
        <h3>editar chofer</h3>
        <input type="text" placeholder="nombre" x-model="formEditarChofer.nombre">
        <input type="text" placeholder="licencia" x-model="formEditarChofer.licencia">
        <select x-model="formEditarChofer.estatus">
            <option value="Disponible">Disponible</option>
            <option value="En Ruta">En Ruta</option>
        </select>
        <button @click="actualizar_chofer()">Guardar cambios</button>
        <button @click="cancelar_edicion_chofer()">Cancelar</button>
        <p x-text="mensaje_chofer"></p>
    </div>

    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>nombre</th>
                    <th>licencia</th>
                    <th>estatus</th>
                    <th>opciones</th>
                </tr>
            </thead>

            <tbody>
                <template x-for="c in Choferes" :key="c.id">
                    <tr>
                        <td x-text="c.nombre"></td>
                        <td x-text="c.licencia"></td>
                        <td x-text="c.estatus"></td>
                        <td><button @click="delete_chofer(c.id)">Borrar</button></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <p x-show="Choferes.length == 0">no hay choferes registrados</p>

</section>
