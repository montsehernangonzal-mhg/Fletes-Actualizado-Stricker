<section>
    <h2>resumen de fletes</h2>

    <div class="indicadores">
        <article>
            <h3>total de fletes</h3>
            <p x-text="Dashboard.total_fletes || 0"></p>
        </article>
        <article>
            <h3>pendientes</h3>
            <p x-text="Dashboard.pendientes || 0"></p>
        </article>
        <article>
            <h3>en transito</h3>
            <p x-text="Dashboard.en_transito || 0"></p>
        </article>
        <article>
            <h3>cuentas por cobrar</h3>
            <p x-text="formato_dinero(Dashboard.cuentas_por_cobrar)"></p>
        </article>
    </div>

    <div x-show="fleteEditando !== null" x-cloak>
        <h3>editar flete</h3>
        <label for="editar_cliente">cliente</label>
        <select id="editar_cliente" x-model="formEditarFlete.cliente_id">
            <option value="">sin cliente</option>
            <template x-for="c in Clientes" :key="c.id">
                <option :value="c.id" x-text="c.nombre"></option>
            </template>
        </select>

        <label for="editar_chofer">chofer</label>
        <select id="editar_chofer" x-model="formEditarFlete.chofer_id">
            <option value="">sin chofer</option>
            <template x-for="ch in Choferes" :key="ch.id">
                <option :value="ch.id" x-text="ch.nombre"></option>
            </template>
        </select>

        <label for="editar_unidad">unidad</label>
        <select id="editar_unidad" x-model="formEditarFlete.unidad_id">
            <option value="">sin unidad</option>
            <template x-for="u in Unidades" :key="u.id">
                <option :value="u.id" x-text="u.placas + ' (' + u.modelo + ')' "></option>
            </template>
        </select>

        <label for="editar_origen">origen</label>
        <input id="editar_origen" type="text" x-model="formEditarFlete.origen">
        <label for="editar_destino">destino</label>
        <input id="editar_destino" type="text" x-model="formEditarFlete.destino">
        <label for="editar_costo">costo</label>
        <input id="editar_costo" type="number" min="0" step="0.01" x-model="formEditarFlete.costo">

        <label for="editar_estatus">estatus</label>
        <select id="editar_estatus" x-model="formEditarFlete.estatus">
            <option value="Pendiente">pendiente</option>
            <option value="En Transito">en transito</option>
            <option value="Entregado">entregado</option>
            <option value="Pagado">pagado</option>
        </select>

        <button x-on:click="actualizar_flete()">guardar cambios</button>
        <button x-on:click="cancelar_edicion_flete()">cancelar</button>
        <p x-text="mensaje_edicion_flete"></p>
    </div>

    <h3>fletes pendientes</h3>
    <div class="tabla">
        <table>
            <thead>
                <tr><th>origen</th><th>destino</th><th>cliente</th><th>chofer</th><th>unidad</th><th>costo</th><th>opciones</th></tr>
            </thead>
            <tbody>
                <template x-for="f in Fletes.filter(item => item.estatus === 'Pendiente')" :key="f.id">
                    <tr>
                        <td x-text="f.origen"></td>
                        <td x-text="f.destino"></td>
                        <td x-text="f.cliente_nombre || 'sin cliente'"></td>
                        <td x-text="f.chofer_nombre || 'sin asignar'"></td>
                        <td x-text="f.unidad_placas || 'sin asignar'"></td>
                        <td x-text="formato_dinero(f.costo)"></td>
                        <td><button x-on:click="editar_flete(f)">editar</button><button x-on:click="delete_flete(f.id)">borrar</button></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <h3>fletes en transito</h3>
    <div class="tabla">
        <table>
            <thead>
                <tr><th>origen</th><th>destino</th><th>cliente</th><th>chofer</th><th>unidad</th><th>costo</th><th>opciones</th></tr>
            </thead>
            <tbody>
                <template x-for="f in Fletes.filter(item => es_en_transito(item.estatus))" :key="f.id">
                    <tr>
                        <td x-text="f.origen"></td>
                        <td x-text="f.destino"></td>
                        <td x-text="f.cliente_nombre || 'sin cliente'"></td>
                        <td x-text="f.chofer_nombre || 'sin asignar'"></td>
                        <td x-text="f.unidad_placas || 'sin asignar'"></td>
                        <td x-text="formato_dinero(f.costo)"></td>
                        <td><button x-on:click="editar_flete(f)">editar</button><button x-on:click="delete_flete(f.id)">borrar</button></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <h3>otros fletes</h3>
    <div class="tabla">
        <table>
            <thead>
                <tr><th>origen</th><th>destino</th><th>cliente</th><th>chofer</th><th>unidad</th><th>estatus</th><th>costo</th><th>opciones</th></tr>
            </thead>
            <tbody>
                <template x-for="f in Fletes.filter(item => item.estatus !== 'Pendiente' && !es_en_transito(item.estatus))" :key="f.id">
                    <tr>
                        <td x-text="f.origen"></td>
                        <td x-text="f.destino"></td>
                        <td x-text="f.cliente_nombre || 'sin cliente'"></td>
                        <td x-text="f.chofer_nombre || 'sin asignar'"></td>
                        <td x-text="f.unidad_placas || 'sin asignar'"></td>
                        <td x-text="f.estatus"></td>
                        <td x-text="formato_dinero(f.costo)"></td>
                        <td><button x-on:click="editar_flete(f)">editar</button><button x-on:click="delete_flete(f.id)">borrar</button></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</section>
