<section>
    <h2>Unidades</h2>

    <div x-show="unidadEditando !== null" x-cloak>
        <h3>editar unidad</h3>
        <input type="text" placeholder="placas" x-model="formEditarUnidad.placas">
        <input type="text" placeholder="modelo" x-model="formEditarUnidad.modelo">
        <select x-model="formEditarUnidad.estatus">
            <option value="Disponible">Disponible</option>
            <option value="En Ruta">En Ruta</option>
        </select>
        <button @click="actualizar_unidad()">Guardar cambios</button>
        <button @click="cancelar_edicion_unidad()">Cancelar</button>
        <p x-text="mensaje_unidad"></p>
    </div>

    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>placas</th>
                    <th>modelo</th>
                    <th>estatus</th>
                    <th>opciones</th>
                </tr>
            </thead>

            <tbody>
                <template x-for="u in Unidades" :key="u.id">
                    <tr>
                        <td x-text="u.placas"></td>
                        <td x-text="u.modelo"></td>
                        <td x-text="u.estatus"></td>
                        <td>
                            <button @click="editar_unidad(u)">Editar</button>
                            <button @click="delete_unidad(u.id)">Borrar</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <p x-show="Unidades.length == 0">no hay unidades registrados</p>

</section>
