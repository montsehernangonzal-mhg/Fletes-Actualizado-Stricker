<section>
    <h2>clientes</h2>

    <div x-show="clienteEditando !== null" x-cloak>
        <h3>editar cliente</h3>
        <input type="text" placeholder="nombre" x-model="formEditarCliente.nombre">
        <input type="text" placeholder="telefono" x-model="formEditarCliente.telefono">
        <input type="number" step="0.01" placeholder="saldo pendiente" x-model.number="formEditarCliente.saldo_pendiente">
        <button @click="actualizar_cliente()">Guardar cambios</button>
        <button @click="cancelar_edicion_cliente()">Cancelar</button>
        <p x-text="mensaje_cliente"></p>
    </div>

    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>nombre</th>
                    <th>telefono</th>
                    <th>saldo pendiente</th>
                    <th>opciones</th>
                </tr>
            </thead>

            <tbody>
                <template x-for="c in Clientes" :key="c.id">
                    <tr>
                        <td x-text="c.nombre"></td>
                        <td x-text="c.telefono"></td>
                        <td x-text="c.saldo_pendiente"></td>
                        <td>
                            <button @click="editar_cliente(c)">Editar</button>
                            <button @click="delete_cliente(c.id)">Borrar</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <p x-show="Clientes.length == 0">no hay clientes registrados</p>

</section>
