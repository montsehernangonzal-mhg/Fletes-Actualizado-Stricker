<section>
    <h2>fletes por pagar</h2>
    <p>fletes entregados que siguen pendientes de pago</p>
    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>fecha</th>
                    <th>cliente</th>
                    <th>telefono</th>
                    <th>origen</th>
                    <th>destino</th>
                    <th>unidad</th>
                    <th>costo</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="f in FletesPorPagar" :key="f.id">
                    <tr>
                        <td x-text="f.fecha_creacion"></td>
                        <td x-text="f.cliente_nombre || 'sin cliente'"></td>
                        <td x-text="f.cliente_telefono || ''"></td>
                        <td x-text="f.origen"></td>
                        <td x-text="f.destino"></td>
                        <td x-text="f.unidad_placas || 'sin asignar'"></td>
                        <td x-text="formato_dinero(f.costo)"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
    <p x-show="FletesPorPagar.length === 0">no hay fletes por pagar</p>
</section>
