<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fletes</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
	<link rel="stylesheet" href="estilo.css">
    <script defer src="app.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@shaun/alpinejs-router@1.3.5/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
	<div id="app" x-data="contexto()">
		<header>

			<nav>
				<div class="cuadro">
				<a x-link href = "/"> Inicio </a>
				</div>
				<div class="cuadro">

				</div>
				<!--<div class="cuadro">
				<a x-link href = "/nuevaunidad"> Agregar unidad </a>
				</div>-->

				</div>
				<div class="cuadro">

				</div>
			</nav>

		<main>

			<template x-route="/clientes"     template="/Componentes/clientes.html"></template>
			<template x-route="/nuevo_flete"  template="/Componentes/nuevo_flete.html"></template>
			<template x-route="/detalle_cliente" template="/Componentes/detalle_cliente.html"></template>
			<template x-route="/por_pagar" template="/Componentes/por_pagar.html"></template>
			<template x-route="/historial" template="/Componentes/historial.html"></template>
